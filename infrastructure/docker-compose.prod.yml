version: '3.8'

# ==============================================================================
# SIH 26090: Production Docker Compose Stack
# Multi-container orchestration for PostgreSQL (pgvector), Redis, MinIO,
# FastAPI backend (4 workers), and Next.js standalone frontend.
# ==============================================================================

networks:
  sih_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sih26090_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artisan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artisan_linkage_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - sih_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artisan_admin} -d ${POSTGRES_DB:-artisan_linkage_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  # 2. Redis 7 for rate-limiting, session blacklisting & caching
  redis:
    image: redis:7-alpine
    container_name: sih26090_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_prod_data:/data
    networks:
      - sih_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  # 3. MinIO S3-Compatible Object Storage for Product Media & Verified Certificates
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: sih26090_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set strong MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_prod_data:/data
    networks:
      - sih_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # 4. FastAPI Backend Application Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sih26090_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_NAME: "SIH 26090 Artisan Market Linkage"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY:?Set strong SECRET_KEY in .env (min 32 chars)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-artisan_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artisan_linkage_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_BUCKET_NAME: artisan-media-public
      S3_PRIVATE_BUCKET_NAME: artisan-documents-private
      CORS_ORIGINS: ${CORS_ORIGINS:-https://artisanlinkage.gov.in,http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-1.5-flash}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-2}
    networks:
      - sih_network
    ports:
      - "127.0.0.1:8000:8000"

  # 5. Next.js Standalone Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sih26090_prod_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: "SIH 26090 Artisan Market Linkage"
    networks:
      - sih_network
    ports:
      - "3000:3000"
